# Example/reference Docker Compose deployment configuration:
services:
  caddy:
    image: "caddy:alpine"
    container_name: "caddy"
    restart: "unless-stopped"
    ports:
      # Avoid unintentional WAN leaks, map ports only on '127.0.0.1' by default. Set
      # 'LAN_IP=192.168.1....' to a different IP address in './.env' to bind to that
      # address instead:
      # The HTTP port:
      - "${LAN_IP:-localhost}:80:80"
      # The HTTPs port:
      - "${LAN_IP:-localhost}:443:443"
      - "${LAN_IP:-localhost}:443:443/udp"
    volumes:
      - "./caddy/etc/caddy/:/etc/caddy/"
      - "./caddy/srv:/srv"
      # Uncomment here and under 'volumes:' below to have Docker manage variable data:
      # - "caddy_data:/data"
      # - "caddy_config:/config"
      # Uncomment here to manage variable data locally in the project/deployment:
      # - "./caddy/data:/data"
      # - "./caddy/config:/config"

# volumes:
#   caddy_data:
#   caddy_config:
